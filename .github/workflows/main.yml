name: Generate Contribution Animations (Snake & Pac-Man)

on:
  # Allows manual run from Actions tab
  workflow_dispatch:

  # Automatically runs every 12 hours
  schedule:
    - cron: "0 */12 * * *"

  # Runs on push to main
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Step 1: Generate Snake Contribution SVGs into dist/
      - name: Generate Snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Step 2: Generate Pac-Man Contribution SVGs into dist/
      - name: Generate Pac-Man SVGs
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}

      # Step 3: Deploy BOTH Snake and Pac-Man files together to the output branch
      - name: Push all SVGs to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
