name: Generate Pac-Man Contribution Graph

on:
  # Allows manual triggering from the Actions tab
  workflow_dispatch:

  # Automatically updates every 24 hours
  schedule:
    - cron: "0 0 * * *"

  # Optional: Runs when pushing to main
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Generates the Pac-Man game SVG eating your contribution dots
      - name: Generate Pac-Man Contribution Graph SVG
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}

      # Pushes the generated SVGs to the `output` branch
      - name: Push SVGs to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
